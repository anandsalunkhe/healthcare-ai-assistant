[project]
name = "healthcare-ai-assistant"
version = "2.0.0"
description = "Production RAG healthcare AI — Weaviate hybrid search, BGE-M3, qwen3:8b"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # API framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # LangChain (prompt templates + OpenAI-compatible client)
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-text-splitters>=0.3",
    # Vector database
    "weaviate-client>=4.9",
    # Embeddings + reranking (BGE-M3 + bge-reranker-base)
    "sentence-transformers>=3.0",
    # Structured data
    "pandas>=2.0",
    # Async HTTP (Ollama model pull + health checks)
    "httpx>=0.27",
    # Configuration
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
