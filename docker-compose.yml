services:

  # ── Weaviate vector database ─────────────────────────────────────────────
  weaviate:
    image: semitechnologies/weaviate:1.29.0
    container_name: healthcare-weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - healthcare-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ── Ollama LLM runtime (GPU-accelerated) ─────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: healthcare-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - healthcare-net
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

  # ── FastAPI backend ──────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthcare-ai-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      WEAVIATE_HOST: weaviate
      WEAVIATE_HTTP_PORT: "8080"
      WEAVIATE_GRPC_PORT: "50051"
      OLLAMA_BASE_URL: http://ollama:11434
      HF_HOME: /hf_cache
      TRANSFORMERS_CACHE: /hf_cache
    volumes:
      - ./data:/app/data
      - hf_cache:/hf_cache
    networks:
      - healthcare-net
    depends_on:
      weaviate:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 10s
      start_period: 120s
      retries: 5

  # ── Streamlit frontend ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthcare-ai-frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    networks:
      - healthcare-net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3


networks:
  healthcare-net:
    driver: bridge

volumes:
  weaviate_data:
  ollama_data:
  hf_cache:
